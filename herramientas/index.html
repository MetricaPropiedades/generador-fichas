        <style>
            :root{--gris:#424549;--gris-2:#36393d;--mostaza:#D19C1D;--texto:#2B2B2B;--suave:#6b6f74;}
            *{box-sizing:border-box;}
            .staticrypt-html,.staticrypt-body{height:100%;margin:0;}
            .staticrypt-body{background:var(--gris);font-family:'Barlow',system-ui,sans-serif;color:var(--texto);-webkit-font-smoothing:antialiased;}
            .staticrypt-content{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));}
            .staticrypt-page{width:100%;max-width:400px;}
            .staticrypt-form{background:#fff;border-radius:14px;padding:34px 28px 28px;box-shadow:0 18px 50px rgba(0,0,0,.35);}
            .marca{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
            .marca img{width:56px;height:56px;border-radius:12px;display:block;}
            .staticrypt-title{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:36px;line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:0;color:var(--texto);}
            .staticrypt-title span{color:var(--mostaza);}
            .bajada{margin:4px 0 0;font-size:14px;color:var(--suave);}
            .staticrypt-instructions p.indicacion{margin:0 0 14px;font-size:17px;font-weight:500;line-height:1.4;}
            .staticrypt-password-container{position:relative;margin:0 0 14px;}
            .staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{width:100%;font:inherit;font-size:18px;padding:15px 52px 15px 16px;min-height:56px;border:2px solid #d8d9db;border-radius:10px;background:#fafafa;color:var(--texto);outline:0;}
            .staticrypt-form input[type="password"]:focus,.staticrypt-form input[type="text"]:focus{border-color:var(--mostaza);background:#fff;}
            .staticrypt-toggle-password-visibility{cursor:pointer;position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;padding:11px;box-sizing:content-box;opacity:.55;}
            label.staticrypt-remember{display:flex;align-items:center;gap:12px;margin:4px 0 18px;font-size:16px;cursor:pointer;user-select:none;}
            .staticrypt-remember input[type="checkbox"]{width:22px;height:22px;accent-color:var(--mostaza);margin:0;}
            .staticrypt-form .staticrypt-decrypt-button{width:100%;min-height:56px;border:0;border-radius:10px;background:var(--mostaza);color:#fff;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:22px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;}
            .staticrypt-form .staticrypt-decrypt-button:hover,.staticrypt-form .staticrypt-decrypt-button:focus-visible{filter:brightness(.93);}
            :focus-visible{outline:3px solid var(--mostaza);outline-offset:3px;}
            .error{display:none;margin:0 0 14px;padding:10px 12px;border-radius:8px;background:#fdecea;color:#9b2c1f;font-size:15px;font-weight:600;}
            .error.on{display:block;}
            .hidden{display:none !important;}
            .staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center;}
            .staticrypt-spinner{width:2.2rem;height:2.2rem;border:.25em solid rgba(255,255,255,.5);border-right-color:transparent;border-radius:50%;animation:giro .75s linear infinite;}
            @keyframes giro{100%{transform:rotate(360deg);}}
            @media (prefers-reduced-motion:reduce){.staticrypt-spinner{animation-duration:2s;}}
        </style>
