<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ficha de Alquiler de Local — Métrica Propiedades</title>
<meta property="og:title" content="Ficha de Alquiler de Local">
<meta property="og:description" content="Generador de fichas de alquiler de local comercial — Métrica Propiedades">
<meta property="og:site_name" content="Métrica Propiedades">
<meta property="og:url" content="https://metricapropiedades.github.io/generador-fichas/ficha-locales.html">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<style>
:root{--gold:#C8941A;--dark:#2B2B2B;--sb-bg:#1a1a1a;--sb-card:#242424;--sb-border:rgba(255,255,255,.08);--g:#C8941A;--border:#e5e5e5;--radius:4px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#111;display:flex;height:100vh;overflow:hidden;}
#sidebar{width:340px;flex-shrink:0;background:var(--sb-bg);overflow-y:auto;display:flex;flex-direction:column;border-right:1px solid var(--sb-border);}
.sb-header{padding:14px 16px 10px;border-bottom:1px solid var(--sb-border);background:#2c2c2c;}
.sb-logo{height:44px;display:block;margin-bottom:10px;}
.sb-title{font-family:'Big Shoulders Display',sans-serif;font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;}
.sb-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.sb-extra-btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.btn-add{background:var(--gold);color:#1a1a1a;border:none;padding:7px 12px;border-radius:var(--radius);font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;}
.btn-add:hover{filter:brightness(1.1);}
.btn-sec{background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);border:1px solid var(--sb-border);padding:7px 12px;border-radius:var(--radius);font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-sec:hover{background:rgba(255,255,255,.12);}
.btn-danger{background:rgba(200,50,50,.15);color:#e07070;border:1px solid rgba(200,50,50,.2);padding:4px 8px;border-radius:var(--radius);font-size:10px;cursor:pointer;font-family:'Inter',sans-serif;}
.sb-map-sec{padding:10px 16px;border-bottom:1px solid var(--sb-border);}
.sb-map-sec h2{font-family:'Big Shoulders Display',sans-serif;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;}
#map-status{font-size:10px;color:rgba(255,255,255,.3);margin-top:3px;min-height:13px;}
.sb-local{background:var(--sb-card);border:1px solid var(--sb-border);border-radius:6px;margin:10px 12px;overflow:hidden;}
.sb-local-header{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;user-select:none;}
.sb-local-num{background:var(--gold);color:#1a1a1a;font-size:10px;font-weight:800;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-local-addr{flex:1;font-size:11px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-local-body{padding:10px 12px;border-top:1px solid var(--sb-border);}
.sb-local-body.collapsed{display:none;}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;}
.field label{font-size:9px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.06em;}
.field input,.field textarea,.field select{background:rgba(255,255,255,.05);border:1px solid var(--sb-border);border-radius:3px;color:rgba(255,255,255,.85);font-size:11px;padding:5px 7px;font-family:'Inter',sans-serif;width:100%;}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gold);background:rgba(200,148,26,.07);}
.field textarea{resize:vertical;min-height:56px;}
.field select option{background:#242424;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.tog{display:flex;gap:3px;margin-top:2px;}
.tog button{flex:1;padding:5px;border-radius:3px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.42);font-size:10px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.tog button.on{background:rgba(200,148,26,.18);color:var(--gold);border-color:rgba(200,148,26,.38);}
.section-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 5px;border-top:1px solid var(--sb-border);padding-top:8px;}
.photo-grid-sb{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.photo-thumb-wrap{position:relative;width:64px;height:56px;}
.photo-thumb-wrap img{width:64px;height:56px;object-fit:cover;border-radius:3px;display:block;}
.ph-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;}
.ph-crop{position:absolute;bottom:2px;right:2px;background:rgba(200,148,26,.8);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.ph-order{display:flex;flex-direction:column;gap:2px;position:absolute;top:2px;left:2px;}
.ph-order button{background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:2px;width:14px;height:12px;font-size:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.file-label{display:block;border:1.5px dashed rgba(255,255,255,.15);border-radius:3px;padding:6px;text-align:center;font-size:10px;color:rgba(255,255,255,.3);cursor:pointer;margin-top:4px;}
.file-label:hover{border-color:var(--gold);color:var(--gold);}
.file-label input{display:none;}
.plano-wrap{position:relative;display:inline-block;margin-top:4px;}
.plano-wrap img{height:48px;border-radius:3px;display:block;}
.plano-wrap .ph-del{top:2px;right:2px;}
.plano-wrap .ph-crop{bottom:2px;right:2px;}
.hint{font-size:9px;color:rgba(255,255,255,.22);margin-top:1px;}
#preview{flex:1;overflow-y:auto;background:#4a4a4a;padding:20px;display:flex;justify-content:center;align-items:flex-start;}
#doc{width:210mm;min-height:297mm;background:#fff;box-shadow:0 4px 32px rgba(0,0,0,.5);}
.doc-header{background:#3C3F44;padding:8mm 13mm 7mm;display:flex;align-items:center;justify-content:space-between;}
.doc-logo{height:66px;}
.doc-title-block{text-align:left;}
.doc-title{font-family:'Big Shoulders Display',sans-serif;font-size:18pt;font-weight:800;color:#fff;line-height:1.1;}
.doc-subtitle{font-size:7pt;color:rgba(255,255,255,.45);margin-top:1mm;letter-spacing:.1em;text-transform:uppercase;}
.local-section{padding:7mm 13mm 6mm;}
.local-num-bar{display:flex;align-items:center;gap:3mm;margin-bottom:4mm;}
.local-badge{background:var(--gold);color:#fff;font-family:'Big Shoulders Display',sans-serif;font-size:11pt;font-weight:800;padding:1mm 3.5mm;border-radius:3px;line-height:1.3;}
.local-addr{font-family:'Big Shoulders Display',sans-serif;font-size:14pt;font-weight:700;color:var(--dark);line-height:1.2;}
.prop-table{width:100%;border-collapse:collapse;margin-bottom:4mm;font-size:12pt;}
.prop-table tr{border-bottom:1px solid #efefef;}
.prop-table tr:last-child{border-bottom:2px solid #ccc;}
.prop-table td{padding:2mm 1mm;}
.prop-table td:first-child{font-weight:700;color:var(--dark);width:45%;}
.prop-table td:last-child{color:#444;text-align:right;}
.prop-table .precio-row td{font-weight:800;font-size:14.5pt;border-top:2px solid #ddd;}
.prop-table .precio-row td:last-child{color:var(--gold);}
.prop-comments{font-size:8pt;color:#555;line-height:1.65;margin-bottom:4mm;padding:2.5mm 4mm;background:#fafafa;border-left:3px solid var(--gold);border-radius:2px;white-space:pre-wrap;}
.photos-grid-1{margin-bottom:4mm;}
.photos-grid-1 img{width:100%;height:auto;border-radius:3px;display:block;}
.photos-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:2mm;margin-bottom:4mm;}
.photos-grid-2 img{width:100%;height:auto;border-radius:3px;display:block;}
.photos-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2mm;margin-bottom:4mm;}
.photos-grid-3 img{width:100%;height:auto;border-radius:3px;display:block;}
.planos-section{margin-bottom:4mm;}
.plano-full{margin-bottom:3mm;}
.plano-full img{width:100%;height:auto;border-radius:3px;display:block;}
.doc-map-section{padding:5mm 13mm 6mm;}
.sec-title{font-family:'Big Shoulders Display',sans-serif;font-size:13pt;font-weight:800;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;border-bottom:1.5px solid var(--gold);padding-bottom:1.5mm;margin-bottom:4mm;}
#leaflet-map{height:90mm;border-radius:4px;border:1px solid #ddd;z-index:0;background:#f5f5f5;}
.map-legend{display:flex;gap:5mm;align-items:center;margin-top:2mm;font-size:7pt;color:#777;}
.map-legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:2px;vertical-align:middle;}
.map-capture{display:none;width:100%;height:auto;border-radius:4px;}
.doc-footer{padding:6mm 13mm 8mm;display:flex;justify-content:space-between;align-items:flex-end;}
.ft{background:#3C3F44;padding:6mm 13mm;display:flex;align-items:flex-start;font-family:'Barlow',sans-serif;}
.ft-col{flex:1;display:flex;flex-direction:column;}
.ft-col.right{align-items:flex-end;margin-left:20mm;}
.ft-line{padding-bottom:2.5mm;margin-bottom:2.5mm;border-bottom:1px solid rgba(209,156,29,.45);width:100%;}
.ft-col.right .ft-line{text-align:right;}
.ft-line:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.ft-row{display:flex;align-items:center;gap:3mm;}
.ft-col.right .ft-row{flex-direction:row-reverse;}
.ft-row svg{width:5mm;height:5mm;color:#D19C1D;flex-shrink:0;}
.ft-row span{font-size:8pt;font-weight:500;color:rgba(255,255,255,.8);letter-spacing:.01em;}
.ft-mat{font-size:8pt;font-weight:500;letter-spacing:.01em;color:#D19C1D;}
.doc-gracias{font-family:'Big Shoulders Display',sans-serif;font-size:20pt;font-weight:800;color:var(--dark);}

#cropper-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;}
.modal-box{background:#1e1e1e;border-radius:8px;padding:20px;max-width:92vw;max-height:92vh;display:flex;flex-direction:column;gap:12px;}
.modal-box img{max-height:68vh;max-width:78vw;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;}
  body{background:#fff;display:block;height:auto;overflow:visible;}
  #sidebar,#cropper-modal{display:none!important;}
  #preview{display:block;padding:0;background:#fff;overflow:visible;}
  #doc{width:100%;box-shadow:none;min-height:unset;}
  @page{size:auto;margin:0;}
  *{page-break-before:avoid!important;page-break-after:avoid!important;page-break-inside:avoid!important;break-before:avoid!important;break-after:avoid!important;break-inside:avoid!important;}
  #leaflet-map{display:none!important;}
  .map-capture{display:block!important;}
}
.placeholder-slot{border:1.5px dashed #ccc;border-radius:4px;padding:8mm 0;text-align:center;color:#bbb;font-size:9pt;margin-bottom:4mm;}
.planos-title{font-family:'Big Shoulders Display',sans-serif;font-size:13pt;font-weight:800;color:#C8941A;text-transform:uppercase;letter-spacing:.06em;margin:5mm 0 3mm;border-bottom:1.5px solid #C8941A;padding-bottom:2mm;}
.photo-thumb-wrap{cursor:grab;}
</style>
</head>
<body>
<aside id="sidebar">
  <div class="sb-header">
    <div class="sb-title" id="sb-title-label">Ficha de Alquiler</div>
    <div class="tog" style="margin-top:6px">
      <button id="tog-alq" class="on" onclick="setTipo('Alquiler')">Alquiler</button>
      <button id="tog-vta" onclick="setTipo('Venta')">Venta</button>
    </div>
    <div class="sb-actions">
      <button class="btn-add" onclick="addLocal()">+ Agregar local</button>
      <button class="btn-sec" onclick="triggerMapGen()">🗺 Mapa</button>
    </div>
    <div class="sb-extra-btns">
      <button class="btn-sec" onclick="exportPDF()">⬇ PDF</button>
      <button class="btn-sec" onclick="saveJSON()">💾 Guardar</button>
      <label class="btn-sec" style="cursor:pointer">📂 Abrir<input type="file" accept=".json" style="display:none" onchange="loadJSON(this)"></label>
    </div>
    <div id="map-status" style="font-size:10px;color:rgba(255,255,255,.3);margin-top:4px;min-height:13px;"></div>
  </div>
  <div id="locals-container"></div>
</aside>
<div id="preview"><div id="doc"></div></div>
<div id="cropper-modal" style="display:none">
  <div class="modal-box">
    <img id="cropper-img" src="" alt="">
    <div class="modal-btns">
      <button class="btn-sec" onclick="rotateCropper(-90)">↺ Rotar</button>
      <button class="btn-sec" onclick="rotateCropper(90)">↻ Rotar</button>
      <button class="btn-sec" onclick="closeCropper()">Cancelar</button>
      <button class="btn-add" onclick="applyCrop()">Aplicar recorte</button>
    </div>
  </div>
</div>

let locals=[], nextId=1, _autoSaveEnabled=false, _mapDebounce=null, _mapRunning=false, _mapInitTimer=null;
let showMap=false, geoCoords={locals:[]}, capturedMapImg=null, geoCache={};
let tipoOperacion='Alquiler';
let leafletMap=null;
let _cropTarget={type:'',localId:0,idx:0}, _cropper=null;
const DRAFT_KEY='metrica_fichas_locales_v1';

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fN(n){return Number(n).toLocaleString('es-AR');}
function delay(ms){return new Promise(r=>setTimeout(r,ms));}

function compressImage(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1920;let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.85));
      };img.src=e.target.result;
    };reader.readAsDataURL(file);
  });
}

function defaultLocal(){
  return{id:nextId++,address:'',disponibilidad:'',supCubierta:'',supPB:'',supPA:'',supSS:'',supTerreno:'',espAereo:'No',frente:'',fondo:'',posicion:'',currency:'USD',precio:'',comentarios:'',photos:[],planos:[],collapsed:false};
}
function setTipo(t){
  tipoOperacion=t;
  document.getElementById('sb-title-label').textContent='Ficha de '+t;
  document.getElementById('tog-alq').classList.toggle('on',t==='Alquiler');
  document.getElementById('tog-vta').classList.toggle('on',t==='Venta');
  renderPreview();autoSave();
}
function addLocal(){locals.push(defaultLocal());renderSidebar();renderPreview();}
function removeLocal(id){locals=locals.filter(l=>l.id!==id);renderSidebar();renderPreview();}
function setL(id,field,value){
  const l=locals.find(l=>l.id===id);if(!l)return;
  l[field]=value;
  if(field==='address'&&showMap){clearTimeout(_mapDebounce);_mapDebounce=setTimeout(function(){triggerMapGen();},1800);}
  const hdr=document.querySelector('.sb-local[data-id="'+id+'"] .sb-local-addr');
  if(hdr)hdr.textContent=l.address||'Local '+(locals.findIndex(x=>x.id===id)+1);
  renderPreview();autoSave();
}
function toggleLocalCollapse(id){
  const l=locals.find(l=>l.id===id);if(!l)return;
  l.collapsed=!l.collapsed;
  const body=document.querySelector('.sb-local[data-id="'+id+'"] .sb-local-body');
  if(body)body.classList.toggle('collapsed',l.collapsed);
}

async function addPhotos(id,input){
  const l=locals.find(l=>l.id===id);if(!l||!input.files.length)return;
  for(const file of Array.from(input.files)){
    const c=await compressImage(file);
    l.photos.push({photo:c,photoOrig:c});
  }
  input.value='';renderPhotosSb(id);renderPreview();autoSave();
}
function removePhoto(id,idx){
  const l=locals.find(l=>l.id===id);if(!l)return;
  l.photos.splice(idx,1);renderPhotosSb(id);renderPreview();autoSave();
}
function movePhoto(id,idx,dir){
  const l=locals.find(l=>l.id===id);if(!l)return;
  const to=idx+dir;if(to<0||to>=l.photos.length)return;
  [l.photos[idx],l.photos[to]]=[l.photos[to],l.photos[idx]];
  renderPhotosSb(id);renderPreview();autoSave();
}
function renderPhotosSb(id){
  const l=locals.find(l=>l.id===id);
  const wrap=document.getElementById('photos-sb-'+id);
  if(!l||!wrap)return;
  wrap.innerHTML=l.photos.map((p,i)=>
    '<div class="photo-thumb-wrap" draggable="true"'+
      ' ondragstart="dragStart(event,'+id+','+i+',\x27photo\x27)"'+
      ' ondragover="dragOver(event)"'+
      ' ondrop="dragDrop(event,'+id+','+i+',\x27photo\x27)">'+
      '<img src="'+p.photo+'" alt="">'+
      '<button class="ph-del" onclick="removePhoto('+id+','+i+')">×</button>'+
      '<button class="ph-crop" onclick="openCropper(0,'+id+','+i+')">✂</button>'+
    '</div>'
  ).join('');
}

async function addPlano(id,input){
  const l=locals.find(l=>l.id===id);if(!l||!input.files[0])return;
  if(!l.planos)l.planos=[];
  for(const file of Array.from(input.files)){
    const c=await compressImage(file);
    l.planos.push({plano:c,planoOrig:c});
  }
  input.value='';renderPlanosSb(id);renderPreview();autoSave();
}
function removePlano(id,i){
  const l=locals.find(l=>l.id===id);if(!l)return;
  l.planos.splice(i,1);
  renderPlanosSb(id);renderPreview();autoSave();
}
function movePlano(id,i,dir){
  const l=locals.find(l=>l.id===id);if(!l)return;
  const j=i+dir;if(j<0||j>=l.planos.length)return;
  [l.planos[i],l.planos[j]]=[l.planos[j],l.planos[i]];
  renderPlanosSb(id);renderPreview();autoSave();
}
function renderPlanosSb(id){
  const l=locals.find(l=>l.id===id);
  const wrap=document.getElementById('planos-sb-'+id);
  if(!l||!wrap)return;
  if(!l.planos)l.planos=[];
  wrap.innerHTML=l.planos.map((p,i)=>
    '<div class="photo-thumb-wrap" draggable="true"'+
      ' ondragstart="dragStart(event,'+id+','+i+',\x27plano\x27)"'+
      ' ondragover="dragOver(event)"'+
      ' ondrop="dragDrop(event,'+id+','+i+',\x27plano\x27)">'+
      '<img src="'+p.plano+'" alt="">'+
      '<button class="ph-del" onclick="removePlano('+id+','+i+')">×</button>'+
      '<button class="ph-crop" onclick="openCropper(1,'+id+','+i+')">✂</button>'+
    '</div>'
  ).join('');
}

function openCropper(typeCode,localId,idx){const types=["photo","plano"];const type=types[typeCode]||"photo";
  const l=locals.find(l=>l.id===localId);if(!l)return;
  let src='';
  if(type==='photo')src=l.photos[idx]?.photoOrig||l.photos[idx]?.photo||'';
  else if(type==='plano')src=l.planos?.[idx]?.planoOrig||l.planos?.[idx]?.plano||'';
  
  if(!src)return;
  _cropTarget={type,localId,idx};
  const cimg=document.getElementById('cropper-img');cimg.src=src;
  document.getElementById('cropper-modal').style.display='flex';
  if(_cropper){_cropper.destroy();_cropper=null;}
  cimg.onload=()=>{_cropper=new Cropper(cimg,{viewMode:1,autoCropArea:.9,movable:true,zoomable:true});};
}
function rotateCropper(deg){
  if(!_cropper)return;
  const img=document.getElementById('cropper-img');
  const w=img.naturalWidth,h=img.naturalHeight;
  const cvs=document.createElement('canvas');
  const swap=Math.abs(deg)===90||Math.abs(deg)===270;
  cvs.width=swap?h:w; cvs.height=swap?w:h;
  const ctx=cvs.getContext('2d');
  ctx.translate(cvs.width/2,cvs.height/2);
  ctx.rotate(deg*Math.PI/180);
  ctx.drawImage(img,-w/2,-h/2);
  const rotated=cvs.toDataURL('image/jpeg',0.92);
  _cropper.destroy();_cropper=null;
  img.src=rotated;
  img.onload=()=>{_cropper=new Cropper(img,{viewMode:1,autoCropArea:.9,movable:true,zoomable:true});};
}
function closeCropper(){
  document.getElementById('cropper-modal').style.display='none';
  if(_cropper){_cropper.destroy();_cropper=null;}
}
function applyCrop(){
  if(!_cropper)return;
  const canvas=_cropper.getCroppedCanvas({maxWidth:1920,maxHeight:1920});
  const cropped=canvas.toDataURL('image/jpeg',0.9);
  const l=locals.find(l=>l.id===_cropTarget.localId);if(!l){closeCropper();return;}
  if(_cropTarget.type==='photo'){if(l.photos[_cropTarget.idx])l.photos[_cropTarget.idx].photo=cropped;}
  else if(_cropTarget.type==='plano'){if(l.planos[_cropTarget.idx])l.planos[_cropTarget.idx].plano=cropped;}
  
  closeCropper();
  renderPhotosSb(_cropTarget.localId);renderPlanosSb(_cropTarget.localId);
  renderPreview();autoSave();
}

function rLocal(l,idx){
  const num=idx+1;
  const dash='—';
  const rows=[];
  rows.push(['Disponibilidad',l.disponibilidad?esc(l.disponibilidad):dash]);
  rows.push(['Superficie Cubierta',l.supCubierta?fN(l.supCubierta)+' m²':dash]);
  rows.push(['Superficie PB',l.supPB?fN(l.supPB)+' m²':dash]);
  rows.push(['Superficie PA',l.supPA?fN(l.supPA)+' m²':dash]);
  rows.push(['Superficie Subsuelo',l.supSS?fN(l.supSS)+' m²':dash]);
  rows.push(['Terreno',l.supTerreno?fN(l.supTerreno)+' m²':dash]);
  rows.push(['Frente',l.frente?fN(l.frente)+' m':dash]);
  if(l.fondo)rows.push(['Fondo',fN(l.fondo)+' m']);
  rows.push(['Espacio Aéreo Propio',l.espAereo?esc(l.espAereo):dash]);
  rows.push(['Posición Relativa',l.posicion?esc(l.posicion):dash]);
  const tableRows=rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('');
  const precioRow='<tr class="precio-row"><td>Precio de '+tipoOperacion.toLowerCase()+'</td><td>'+(l.precio?esc(l.currency)+' '+esc(l.precio):dash)+'</td></tr>';
  const tableHtml='<table class="prop-table"><tbody>'+tableRows+precioRow+'</tbody></table>';

  let photosHtml='';
  if(l.photos.length===1){
    photosHtml='<div class="photos-grid-1"><img src="'+l.photos[0].photo+'" alt=""></div>';
  }else if(l.photos.length===2){
    photosHtml='<div class="photos-grid-2">'+l.photos.map(p=>'<img src="'+p.photo+'" alt="">').join('')+'</div>';
  }else if(l.photos.length>=3){
    photosHtml='<div class="photos-grid-3">'+l.photos.map(p=>'<img src="'+p.photo+'" alt="">').join('')+'</div>';
  }else{
    photosHtml='<div class="placeholder-slot">📷 Imagen del local</div>';
  }

  let planosHtml='';
  if(l.planos&&l.planos.length){
    planosHtml='<div class="planos-title">Planos</div><div class="planos-section">';
    l.planos.forEach(p=>{planosHtml+='<div class="plano-full"><img src="'+p.plano+'" alt="Plano"></div>';});
    planosHtml+='</div>';
  }

  return '<div class="local-section">'+
    '<div class="local-num-bar">'+
      '<div class="local-addr">📍 '+(esc(l.address)||'Dirección no especificada')+'</div>'+
    '</div>'+
    tableHtml+
    (l.comentarios?'<div class="prop-comments">'+esc(l.comentarios)+'</div>':'')+
    photosHtml+planosHtml+
  '</div>';
}

      <radialGradient id="pg${label||'s'}" cx="38%" cy="32%" r="60%">

function mkBlueIcon(num){

  return L.divIcon({className:'',html,iconSize:[0,0]});
}

async function nominatim(address){
  const key=address.trim().toLowerCase();
  if(key in geoCache)return geoCache[key];
  let addr=address.trim()
    .replace(/\bCABA\b/gi,'Buenos Aires')
    .replace(/\bAv\.\s*/gi,'Avenida ')
    .replace(/\bGral\.\s*/gi,'General ');
  const q=addr+(addr.toLowerCase().includes('buenos aires')||addr.toLowerCase().includes('argentina')?', Argentina':', Argentina');
  try{
    const r=await fetch('https://photon.komoot.io/api/?q='+encodeURIComponent(q)+'&limit=3&lang=es');
    const d=await r.json();
    const f=d.features?.find(f=>f.properties?.country==='Argentina')||d.features?.[0];
    if(f?.geometry?.coordinates){const[lon,lat]=[f.geometry.coordinates[0],f.geometry.coordinates[1]];const result={lat,lon};geoCache[key]=result;return result;}
  }catch(e){}
  try{
    await delay(1100);
    const r=await fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+'&format=json&limit=1&countrycodes=ar',{headers:{'Accept-Language':'es','User-Agent':'MetricaPropiedades/1.0'}});
    const d=await r.json();
    const result=d[0]?{lat:parseFloat(d[0].lat),lon:parseFloat(d[0].lon)}:null;
    if(result)geoCache[key]=result;return result;
  }catch(e){return null;}
}

function initMapFromCache(){
  const mapDiv=document.getElementById('leaflet-map');
  if(!mapDiv)return;
  if(leafletMap){leafletMap.remove();leafletMap=null;}
  leafletMap=L.map('leaflet-map',{zoomControl:true,attributionControl:true});
  L.tileLayer('https://{s}.tile.thunderforest.com/atlas/{z}/{x}/{y}.png?apikey=799db6d6ca3343839a985264e7476796',{attribution:'© <a href="https://www.thunderforest.com">Thunderforest</a> © <a href="https://www.openstreetmap.org">OpenStreetMap</a>',maxZoom:19,crossOrigin:true}).addTo(leafletMap);
  const bounds=[];let n=0;
  geoCoords.locals.forEach(item=>{
    if(!item?.coord)return;
    n++;const{lat,lon}=item.coord;
    L.marker([lat,lon],{icon:mkBlueIcon(n)}).addTo(leafletMap).bindPopup('<b>Local '+n+'</b><br>'+(item.addr||''));
    bounds.push([lat,lon]);
  });
  if(geoCoords.savedView){
    leafletMap.setView([geoCoords.savedView.lat,geoCoords.savedView.lng],geoCoords.savedView.zoom);
  }else if(bounds.length===0){
    leafletMap.setView([-34.603722,-58.381592],13);
  }else if(bounds.length===1){
    leafletMap.setView(bounds[0],15);
  }else{
    leafletMap.fitBounds(bounds,{padding:[20,20]});
  }
  leafletMap.on('moveend zoomend',function(){
    geoCoords.savedView={lat:leafletMap.getCenter().lat,lng:leafletMap.getCenter().lng,zoom:leafletMap.getZoom()};
  });
}

async function triggerMapGen(){
  if(_mapRunning)return;
  _mapRunning=true;
  showMap=true;capturedMapImg=null;
  geoCoords.savedView=null;
  Object.keys(geoCache).forEach(k=>delete geoCache[k]);
  const st=document.getElementById('map-status');
  if(st)st.textContent='Buscando ubicaciones...';
  renderPreview();await delay(80);
  geoCoords.locals=[];let found=0;
  for(let i=0;i<locals.length;i++){
    const l=locals[i];
    if(i>0)await delay(400);
    if(l.address&&l.address.trim()){
      if(st)st.textContent='Buscando local '+(i+1)+'...';
      const coord=await nominatim(l.address);
      geoCoords.locals.push({id:l.id,addr:l.address,coord});
      if(coord)found++;
    }else geoCoords.locals.push({id:l.id,addr:'',coord:null});
  }
  if(st)st.textContent=found?'Mapa generado ('+found+' ubicaciones)':'No se encontraron ubicaciones';
  initMapFromCache();autoSave();_mapRunning=false;
}

function getState(){return{version:1,tipoOperacion,locals:locals.map(l=>({...l})),map:{showMap,geoCoords,capturedMapImg}};}
function applyState(state){
  if(!state)return;
  locals=(state.locals||[]).map(l=>({...l}));
  nextId=locals.length?Math.max(...locals.map(l=>l.id))+1:1;
  if(state.tipoOperacion)setTipo(state.tipoOperacion);
  const m=state.map||{};
  showMap=m.showMap||false;geoCoords=m.geoCoords||{locals:[]};capturedMapImg=m.capturedMapImg||null;
  renderSidebar();renderPreview();
  if(showMap)setTimeout(()=>initMapFromCache(),300);
}
function autoSave(){if(!_autoSaveEnabled)return;try{localStorage.setItem(DRAFT_KEY,JSON.stringify(getState()));}catch(e){}}
async function saveJSON(){
  const json=JSON.stringify(getState(),null,2);
  const name='Fichas-Locales-Metrica.json';
  if(window.showSaveFilePicker){try{const fh=await window.showSaveFilePicker({suggestedName:name,types:[{description:'JSON',accept:{'application/json':['.json']}}]});const w=await fh.createWritable();await w.write(json);await w.close();return;}catch(e){if(e.name==='AbortError')return;}}
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([json],{type:'application/json'})),download:name});a.click();URL.revokeObjectURL(a.href);
}
function loadJSON(input){
  if(!input.files[0])return;
  const reader=new FileReader();
  reader.onload=e=>{try{applyState(JSON.parse(e.target.result));}catch(err){alert('Archivo inválido');}};
  reader.readAsText(input.files[0]);input.value='';
}
async function exportPDF(){
  if(showMap&&leafletMap){
    try{
      leafletMap.invalidateSize();
      await new Promise(r=>setTimeout(r,400));
      const mc=await html2canvas(document.getElementById('leaflet-map'),{useCORS:true,allowTaint:false,logging:false,scale:1.5});
      capturedMapImg=mc.toDataURL('image/jpeg',0.92);
    }catch(e){}
    renderPreview();
    await new Promise(r=>setTimeout(r,300));
  }
  const docEl=document.getElementById('doc');
  docEl.style.minHeight='0';
  await new Promise(r=>setTimeout(r,100));
  const mapDiv=document.getElementById('leaflet-map');
  const mapCapture=document.querySelector('.map-capture');
  if(mapDiv)mapDiv.style.display='none';
  if(mapCapture)mapCapture.style.display='block';
  const cvs=await html2canvas(docEl,{scale:4,useCORS:true,allowTaint:false,backgroundColor:'#ffffff',logging:false});
  if(mapDiv)mapDiv.style.display='';
  if(mapCapture)mapCapture.style.display='';
  const img=cvs.toDataURL('image/jpeg',0.98);
  const wMm=210;
  const hMm=Math.round(wMm*cvs.height/cvs.width);
  docEl.style.minHeight='';
  const win=window.open('','_blank');
  win.document.write('<!DOCTYPE html><html><head><style>*{margin:0;padding:0;}@page{size:'+wMm+'mm '+hMm+'mm;margin:0;}body{margin:0;}img{width:'+wMm+'mm;display:block;}</style></head><body><img src="'+img+'"></body></html>');
  win.document.close();
  win.focus();
  setTimeout(()=>{win.print();},600);
}


function dragStart(ev,localId,idx,type){ev.dataTransfer.setData("dnd",JSON.stringify({localId,idx,type}));ev.dataTransfer.effectAllowed="move";}
function dragOver(ev){ev.preventDefault();}
function dragDrop(ev,localId,toIdx,type){
  ev.preventDefault();
  var d=JSON.parse(ev.dataTransfer.getData("dnd")||"{}");
  if(d.localId!==localId||d.type!==type||d.idx===toIdx)return;
  var l=locals.find(function(x){return x.id===localId;});if(!l)return;
  var arr=type==="photo"?l.photos:l.planos;
  var item=arr.splice(d.idx,1)[0];arr.splice(toIdx,0,item);
  if(type==="photo")renderPhotosSb(localId);else renderPlanosSb(localId);
  renderPreview();autoSave();
}
function sLev(el){setL(+el.dataset.id,el.dataset.f,el.value);}
function sLbt(el){setL(+el.dataset.id,el.dataset.f,el.dataset.v);}
function init(){
  try{
    const raw=localStorage.getItem(DRAFT_KEY);
    if(raw){const parsed=JSON.parse(raw);if(parsed?.locals?.length>0){applyState(parsed);_autoSaveEnabled=true;return;}}
  }catch(e){}
  showMap=true;addLocal();_autoSaveEnabled=true;
}
init();
</script>
